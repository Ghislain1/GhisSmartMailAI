[project]
name = "outlook-mcp-server"
version = "0.1.0"
description = "MCP server for reading and writing Outlook emails via Microsoft Graph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp[cli]>=1.6.0",
  "msal>=1.31.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.6.0",
]

[project.scripts]
outlook-mcp-server = "outlook_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outlook_mcp_server"]
